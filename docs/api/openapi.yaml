openapi: 3.1.0
info:
  title: Anantalia Trans Backend — implemented endpoints
  version: 0.1.0
  description: >-
    This document describes routes currently mounted by the backend across
    public catalog, public booking requests, authentication/MFA, profile,
    fleet management, dashboard summary, and operational admin modules
    (bookings, customers, pricing, finance, inbox messages, content, analytics,
    and system settings). Operational business modules are wired with
    Prisma/PostgreSQL repositories via dependency injection.
paths:
  /api/v1/public/rental-types:
    get:
      summary: List rental types backed by at least one verified public model
      responses:
        '200': { description: Publicly selectable rental types }
        '500': { description: Catalog storage is unavailable }
  /api/v1/public/vehicle-categories:
    get:
      summary: List active categories with verified models for a rental type
      parameters:
        - in: query
          name: rentalType
          required: true
          schema: { type: string, enum: [self_drive, with_driver] }
      responses:
        '200': { description: Public category allowlist }
        '400': { description: Invalid rental type }
  /api/v1/public/vehicle-models:
    get:
      summary: List verified models for a category and rental type
      parameters:
        - in: query
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: rentalType
          required: true
          schema: { type: string, enum: [self_drive, with_driver] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Public model allowlist; excludes units, prices, and availability }
        '400': { description: Invalid query }
  /api/v1/public/fleet-catalog:
    get:
      summary: List active & verified public fleet catalog enriched with photo, description, specs, starting price, and unit availability
      parameters:
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Public fleet catalog items }
  /api/v1/public/vehicle-models/{idOrSlug}:
    get:
      summary: Get single active & verified public vehicle model detail by UUID or slug
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public vehicle model detail }
        '404': { description: Model not found or not published }
  /api/v1/public/vehicle-media/{mediaId}:
    get:
      summary: Serve uploaded vehicle model photo binary with non-executable headers
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Binary image (PNG, JPEG, or WebP) }
        '404': { description: Media not found }
  /api/v1/admin/vehicle-categories:
    get:
      summary: Search and page vehicle categories
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: includeInactive, schema: { type: boolean, default: false } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated categories; requires FLEET_VIEW }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
    post:
      summary: Create a vehicle category
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
                sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
      responses:
        '201': { description: Category created; requires FLEET_CREATE }
        '400': { description: Invalid category }
        '409': { description: Slug already exists }
  /api/v1/admin/vehicle-categories/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read one vehicle category
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Category details }
        '404': { description: Category not found }
    patch:
      summary: Update an allowlisted category field
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                slug: { type: string, maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
                sortOrder: { type: integer }
                isActive: { type: boolean }
      responses:
        '200': { description: Category updated; requires FLEET_UPDATE }
        '409': { description: Slug already exists }
    delete:
      summary: Soft-deactivate a category
      security: [{ sessionCookie: [], csrfCookie: [] }]
      responses:
        '204': { description: Category deactivated; requires FLEET_DELETE }
  /api/v1/admin/vehicle-models:
    get:
      summary: Search and page vehicle models with category and rental options
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: isActive, schema: { type: boolean } }
        - { in: query, name: isVerified, schema: { type: boolean } }
        - { in: query, name: includeInactive, schema: { type: boolean, default: false } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated model catalog; requires FLEET_VIEW }
    post:
      summary: Create a model with both rental options disabled and verification off
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, slug, name]
              properties:
                categoryId: { type: string, format: uuid }
                slug: { type: string, maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
                seatCount: { type: [integer, 'null'], minimum: 1, maximum: 200 }
                publicSpecs: { type: [object, 'null'] }
      responses:
        '201': { description: Model created; requires FLEET_CREATE }
        '400': { description: Invalid model }
        '404': { description: Active category not found }
        '409': { description: Slug already exists }
  /api/v1/admin/vehicle-models/upload-image:
    post:
      summary: Upload a vehicle model photo (PNG, JPEG, or WebP) with magic-byte validation
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, dataBase64]
              properties:
                fileName: { type: string }
                mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
                dataBase64: { type: string }
      responses:
        '201': { description: Uploaded image metadata and public URL; requires FLEET_CREATE or FLEET_UPDATE }
        '400': { description: Invalid image format, extension, or magic bytes }
        '413': { description: Image exceeds maximum size limit }
  /api/v1/admin/vehicle-models/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read a model, category, and its rental options
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Model details; requires FLEET_VIEW }
        '404': { description: Model not found }
    patch:
      summary: Update model fields; verification additionally requires FLEET_APPROVE
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                categoryId: { type: string, format: uuid }
                slug: { type: string, maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
                seatCount: { type: [integer, 'null'], minimum: 1, maximum: 200 }
                publicSpecs: { type: [object, 'null'] }
                isActive: { type: boolean }
                isVerified: { type: boolean }
      responses:
        '200': { description: Model updated }
        '403': { description: Required permission is missing }
        '409': { description: Slug already exists }
    delete:
      summary: Deactivate or permanently delete a model (hard delete when ?permanent=true and no unit/booking relations exist; otherwise safe deactivation)
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: query
          name: permanent
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Deletion or safe-deactivation result when permanent=true; requires FLEET_DELETE }
        '204': { description: Model deactivated when permanent=false; requires FLEET_DELETE }
  /api/v1/admin/vehicle-models/{id}/rental-options:
    get:
      summary: List the supported rental options for a model
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rental options; requires FLEET_VIEW }
        '404': { description: Model not found }
  /api/v1/admin/vehicle-models/{id}/rental-options/{rentalType}:
    put:
      summary: Enable or disable a supported rental option
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: rentalType, required: true, schema: { type: string, enum: [self_drive, with_driver] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [isEnabled], properties: { isEnabled: { type: boolean } } }
      responses:
        '200': { description: Option updated; enabling requires FLEET_APPROVE, disabling requires FLEET_UPDATE }
        '400': { description: Invalid rental type or body }
        '404': { description: Active model not found }
  /health:
    get:
      summary: Check application and database health
      responses:
        '200':
          description: Application and database are available
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, checks]
                properties:
                  status: { type: string, const: ok }
                  timestamp: { type: string, format: date-time }
                  checks:
                    type: object
                    required: [database]
                    properties:
                      database: { type: string, const: ok }
              example:
                status: ok
                timestamp: '2026-11-05T12:00:00.000Z'
                checks: { database: ok }
        '503':
          description: Database health query failed
  /auth/csrf:
    get:
      summary: Issue or refresh the anonymous CSRF cookie
      responses:
        '200':
          description: CSRF token is returned in the body and response header
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
  /auth/login:
    post:
      summary: Verify local credentials and begin mandatory MFA
      description: Supply exactly one of email or username. Send the CSRF token in the request body.
      security: [{ csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, csrfToken]
              properties:
                email: { type: string, format: email }
                username: { type: string }
                password: { type: string, format: password, writeOnly: true }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Credentials verified; MFA challenge issued }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
        '403': { description: CSRF validation failed }
        '429': { description: Login rate limit reached }
        '500': { description: Internal error }
  /auth/mfa/verify:
    post:
      summary: Verify a TOTP code and establish an admin session
      security: [{ csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code, csrfToken]
              properties:
                challenge: { type: string, writeOnly: true }
                code: { type: string, pattern: '^\d{6}$', writeOnly: true }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Authentication succeeded; session and CSRF cookies are set }
        '400': { description: Invalid request }
        '401': { description: MFA verification failed }
        '403': { description: CSRF validation failed }
        '429': { description: MFA rate limit reached }
        '500': { description: Internal error }
  /auth/session:
    get:
      summary: Validate the current admin session
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session is valid }
        '401': { description: Session is invalid or expired }
        '500': { description: Internal error }
  /auth/me:
    get:
      summary: Read the authenticated account and granted permissions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current active account
          content:
            application/json:
              schema:
                type: object
                required: [user, expiresAt]
                properties:
                  user:
                    type: object
                    required: [id, email, username, roles, permissions]
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      username: { type: string }
                      displayName: { type: [string, 'null'] }
                      roles: { type: array, items: { type: string, enum: [SUPER_ADMIN, ADMIN, STAFF] } }
                      permissions: { type: array, items: { type: string } }
                  expiresAt: { type: string, format: date-time }
        '401': { description: Session is invalid, expired, or account is inactive }
        '500': { description: Internal error }
  /auth/session/rotate:
    post:
      summary: Rotate the current session token
      description: Send the session cookie and CSRF cookie; the request body must contain the CSRF token.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrfToken]
              properties:
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Session token rotated; replacement cookies are set }
        '401': { description: Session is invalid or expired }
        '403': { description: CSRF validation failed }
        '500': { description: Internal error }
  /auth/sessions/revoke-all:
    post:
      summary: Revoke all sessions belonging to the authenticated account
      description: Revokes every current account session, including this session. Requires a valid CSRF token.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrfToken]
              properties:
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: All sessions revoked; caller must sign in again }
        '401': { description: Authentication required }
        '403': { description: CSRF validation failed }
        '503': { description: Revocation unavailable }
  /auth/logout:
    post:
      summary: Revoke the current session
      security: [{ csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrfToken]
              properties:
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Logout completed }
        '403': { description: CSRF validation failed }
        '503': { description: Session could not be revoked }
  /api/admin/create:
    post:
      summary: Create an ADMIN or STAFF account
      description: Requires CSRF token in X-CSRF-Token or the request body.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, roles]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                username: { type: string, minLength: 3, maxLength: 64 }
                displayName: { type: [string, 'null'], maxLength: 200 }
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [ADMIN, STAFF] }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '201':
          description: Admin account created
          content:
            application/json:
              schema:
                type: object
                required: [id, email, username]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  username: { type: string }
              example:
                id: 00000000-0000-4000-8000-000000000001
                email: admin@example.invalid
                username: example-admin
        '400': { description: Invalid account or role input }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '409': { description: Account conflicts with existing data }
  /api/admin/list:
    get:
      summary: List manageable admin accounts
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Paginated account list }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
  /api/admin/{id}:
    get:
      summary: Read one manageable admin account
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account details }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
  /api/admin/{id}/role:
    post:
      summary: Replace an ADMIN or STAFF account's manageable roles
      description: Requires CSRF token in X-CSRF-Token or the request body.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [ADMIN, STAFF] }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Roles replaced }
        '400': { description: Invalid role input }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
        '409': { description: Account is not manageable }
  /api/admin/{id}/suspend:
    post:
      summary: Suspend an ADMIN or STAFF account
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account suspended }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
  /api/admin/{id}/disable:
    post:
      summary: Disable an ADMIN or STAFF account
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account disabled }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
  /api/admin/{id}/reactivate:
    post:
      summary: Reactivate a suspended or disabled ADMIN or STAFF account
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account reactivated }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
  /api/admin/{id}/delete:
    post:
      summary: Soft-delete an ADMIN or STAFF account
      security: [{ sessionCookie: [], csrfCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account soft-deleted }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Account not found }
  /api/me:
    get:
      summary: Read the authenticated user's profile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Profile details }
        '401': { description: Authentication required }
        '404': { description: Account not found }
  /api/me/email:
    post:
      summary: Reject direct unverified email change
      description: Direct email change without OTP verification is rejected with EMAIL_VERIFICATION_REQUIRED. Use /api/me/email/request-otp and /api/me/email/confirm-otp instead.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '401': { description: Authentication required }
        '501': { description: Email verification OTP flow required }
  /api/me/email/request-otp:
    post:
      summary: Request OTP verification code for email change
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail: { type: string, format: email }
      responses:
        '200': { description: OTP dispatched to target email }
        '400': { description: Invalid email value }
        '409': { description: Email already in use }
        '502': { description: Email gateway delivery failed }
        '503': { description: Email service not configured (SMTP_WEBHOOK_URL missing) }
  /api/me/email/confirm-otp:
    post:
      summary: Confirm email change with 6-digit OTP
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, code]
              properties:
                newEmail: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Email updated after OTP verification }
        '400': { description: Invalid or expired OTP }
        '409': { description: Email already in use }
        '429': { description: Maximum OTP verification attempts exceeded }
  /api/me/username:
    post:
      summary: Change the authenticated user's username
      description: Requires CSRF token in X-CSRF-Token or the request body.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3 }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Username updated }
        '400': { description: Invalid username }
        '401': { description: Authentication required }
        '409': { description: Username already in use }
  /api/me/displayName:
    post:
      summary: Change the authenticated user's display name
      description: Requires CSRF token in X-CSRF-Token or the request body.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: [string, 'null'] }
                csrfToken: { type: string, writeOnly: true }
      responses:
        '200': { description: Display name updated }
        '400': { description: Invalid display name }
        '401': { description: Authentication required }
  /api/me/password:
    post:
      summary: Change the authenticated user's password
      description: Requires CSRF token in X-CSRF-Token or the request body.
      security: [{ sessionCookie: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password, writeOnly: true }
                newPassword: { type: string, format: password, writeOnly: true }
                csrfToken: { type: string, writeOnly: true }
      responses:
